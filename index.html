<title>TS Maths Buddy - Class 10</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1c1e26; --sub:#5b5f6d;
  --accent:#5b47e0; --accent2:#00a389; --border:#e4e6ee; --warn:#e0574a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14151c; --card:#1d1f2a; --text:#eceef5; --sub:#a3a7b7; --accent:#8b7bff; --accent2:#33c9ab; --border:#2b2e3c; --warn:#ff7a6e; }
}
:root[data-theme="dark"]{ --bg:#14151c; --card:#1d1f2a; --text:#eceef5; --sub:#a3a7b7; --accent:#8b7bff; --accent2:#33c9ab; --border:#2b2e3c; --warn:#ff7a6e; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
header{position:sticky;top:0;padding:env(safe-area-inset-top,0px) 16px 0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border);}
header .in{padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;max-width:820px;margin:0 auto;}
h1{font-size:1.15rem;margin:0;} h1 span{color:var(--accent);}
nav{display:flex;gap:6px;overflow-x:auto;max-width:820px;margin:0 auto;padding-bottom:10px;}
nav button{flex:none;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer;}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;}
.chip:hover{border-color:var(--accent);}
.chip .n{font-size:.7rem;color:var(--sub);}
.chip .t{font-weight:600;font-size:.92rem;margin-top:3px;}
.chip .bar{height:5px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden;}
.chip .bar i{display:block;height:100%;background:var(--accent2);width:0%;}
h2{font-size:1.05rem;margin:0 0 10px;} h3{font-size:.95rem;margin:14px 0 6px;color:var(--accent);}
.formula{border-bottom:1px dashed var(--border);padding:8px 0;font-size:.9rem;} .formula b{color:var(--accent);}
.soon{color:var(--sub);font-size:.8rem;font-style:italic;}
.back{color:var(--accent);background:none;border:none;font-size:.9rem;cursor:pointer;padding:0 0 12px;}
button.primary{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:.9rem;cursor:pointer;}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:10px 16px;border-radius:9px;font-size:.9rem;cursor:pointer;}
.example{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:10px;font-size:.88rem;}
.example .lbl{font-weight:600;color:var(--accent2);margin-bottom:4px;}
.step{padding:3px 0 3px 10px;border-left:2px solid var(--border);margin-left:2px;font-size:.85rem;}
.problem{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.problem .diff{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;}
.problem .ptext{font-weight:600;margin:6px 0 10px;font-size:.92rem;}
.solbox{display:none;background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:.87rem;}
.selfcheck{display:flex;gap:8px;margin-top:10px;}
.selfcheck button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer;}
.selfcheck button.got-it{border-color:var(--accent2);}
.selfcheck button.missed{border-color:var(--warn);}
.selfcheck button.picked{opacity:.55;}
.weakrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border);}
.weakrow .acc{font-weight:600;} .acc.low{color:var(--warn);} .acc.mid{color:#d99a2b;} .acc.high{color:var(--accent2);}
</style>
</head>

    {q:"A kite is flying at a height of 60m, attached to a string inclined at 60° to the ground. Find the length of the string.", diff:"Word problem", steps:["sin60° = 60/L","L = 60/sin60° = 60/(√3/2) = 120/√3 = 40√3 m"]},

    {q:"From a point on the ground, the angle of elevation of the top of a tower is 60°. Moving 40m closer, the angle becomes 90°... (instead: from 40m away, angle is 60°, find height).", diff:"Direct", steps:["tan60°=h/40","h=40√3 m"]},

    {q:"A man standing 40m from a tower observes the angle of elevation of the top as 45°. Find the height of the tower.", diff:"Direct", steps:["tan45°=h/40 → h=40m (since tan45°=1)"]}

function getProgress(){ try{ const p=localStorage.getItem('tsmb_topic_progress'); return p?JSON.parse(p):{}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem('tsmb_topic_progress', JSON.stringify(p)); }catch(e){} }
function markResult(topicId, gotIt){
  const p = getProgress();
  if(!p[topicId]) p[topicId] = {attempted:0, correct:0};
  p[topicId].attempted++;
  if(gotIt) p[topicId].correct++;
  saveProgress(p);
}
function topicAccuracy(topicId){
  const p = getProgress()[topicId];
  if(!p || p.attempted===0) return null;
  return Math.round((p.correct/p.attempted)*100);
}
function chapterAvgAccuracy(chapterId){
  const topics = TOPICS[chapterId];
  if(!topics) return 0;
  let sum=0, n=0;
  topics.forEach(t=>{ const a=topicAccuracy(t.id); if(a!==null){sum+=a; n++;} });
  return n? Math.round(sum/n) : 0;
}

let tab='chapters';
const nav=document.getElementById('nav');
const tabs=[['chapters','Chapters'],['formulas','Formula Bank'],['weak','Weak Areas']];
tabs.forEach(([id,label])=>{
  const b=document.createElement('button'); b.textContent=label; b.id='nav-'+id;
  b.onclick=()=>{tab=id; render();};
  nav.appendChild(b);
});

function render(){
  tabs.forEach(([id])=>document.getElementById('nav-'+id).classList.toggle('active', tab===id));
  const main=document.getElementById('main'); main.innerHTML='';
  if(tab==='chapters') renderChapters(main);
  if(tab==='formulas') renderFormulaPicker(main);
  if(tab==='weak') renderWeak(main);
}

function renderChapters(main){
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h2>TS SSC Class 10 Maths — Syllabus</h2><p class="soon">Every chapter has worked examples and textbook-style practice problems with full step-by-step solutions.</p><div class="grid" id="cg"></div>';
  main.appendChild(card);
  const cg=card.querySelector('#cg');
  CHAPTERS.forEach((c,i)=>{
    const pct = chapterAvgAccuracy(c.id);
    const div=document.createElement('div'); div.className='chip';
    div.innerHTML=`<div class="n">Chapter ${i+1}${c.built?'':' · formulas only'}</div><div class="t">${c.name}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
    div.onclick=()=> c.built ? showTopics(c.id) : (tab='formulas', render(), showFormulas(c.id));
    cg.appendChild(div);
  });
}

function showTopics(chapterId){
  const c = CHAPTERS.find(x=>x.id===chapterId);
  const topics = TOPICS[chapterId];
  const main=document.getElementById('main'); main.innerHTML='';
  const back=document.createElement('button'); back.className='back'; back.textContent='← Back to chapters';
  back.onclick=()=>{tab='chapters'; render();}; main.appendChild(back);
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<h2>${c.name} — Topics</h2>`;
  main.appendChild(card);
  topics.forEach(t=>{
    const acc = topicAccuracy(t.id);
    const div=document.createElement('div'); div.className='chip'; div.style.marginBottom='10px'; div.style.display='block';
    div.innerHTML=`<div class="t">${t.name}</div><div class="n">${acc===null?'Not attempted yet':'Self-checked accuracy: '+acc+'%'} · ${t.problems.length} practice problems</div>`;
    div.onclick=()=>showTopic(chapterId, t.id);
    card.appendChild(div);
  });
}

function showTopic(chapterId, topicId){
  const t = TOPICS[chapterId].find(x=>x.id===topicId);
  const main=document.getElementById('main'); main.innerHTML='';
  const back=document.createElement('button'); back.className='back'; back.textContent='← Back to topics';
  back.onclick=()=>showTopics(chapterId); main.appendChild(back);

  const concept=document.createElement('div'); concept.className='card';
  concept.innerHTML=`<h2>${t.name}</h2><p style="font-size:.9rem">${t.concept}</p>`;
  main.appendChild(concept);

  const ex=document.createElement('div'); ex.className='card';
  ex.innerHTML='<h3>Worked Examples</h3>';
  t.examples.forEach(e=>{
    const d=document.createElement('div'); d.className='example';
    d.innerHTML=`<div class="lbl">${e.q}</div>` + e.steps.map(s=>`<div class="step">${s}</div>`).join('');
    ex.appendChild(d);
  });
  main.appendChild(ex);

  const pr=document.createElement('div'); pr.className='card';
  pr.innerHTML='<h3>Practice — solve on paper, then check your steps</h3>';
  t.problems.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='problem';
    d.innerHTML=`<div class="diff">${p.diff}</div><div class="ptext">${i+1}. ${p.q}</div>`;
    const showBtn=document.createElement('button'); showBtn.className='ghost'; showBtn.textContent='Show solution';
    const sol=document.createElement('div'); sol.className='solbox';
    sol.innerHTML = p.steps.map(s=>`<div class="step">${s}</div>`).join('');
    const check=document.createElement('div'); check.className='selfcheck'; check.style.display='none';
    const gotIt=document.createElement('button'); gotIt.textContent='✓ I solved it correctly';
    const missed=document.createElement('button'); missed.textContent='✗ I need more practice';
    check.appendChild(gotIt); check.appendChild(missed);
    showBtn.onclick=()=>{
      sol.style.display='block'; check.style.display='flex'; showBtn.style.display='none';
    };
    gotIt.onclick=()=>{ markResult(t.id, true); gotIt.classList.add('got-it','picked'); missed.classList.add('picked'); gotIt.disabled=true; missed.disabled=true; };
    missed.onclick=()=>{ markResult(t.id, false); missed.classList.add('missed','picked'); gotIt.classList.add('picked'); gotIt.disabled=true; missed.disabled=true; };
    d.appendChild(showBtn); d.appendChild(sol); d.appendChild(check);
    pr.appendChild(d);
  });
  main.appendChild(pr);
}

function renderFormulaPicker(main){
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h2>Formula Bank</h2><p class="soon">Tap a chapter to view its key formulas.</p><div class="grid" id="fg"></div>';
  main.appendChild(card);
  const fg=card.querySelector('#fg');
  CHAPTERS.forEach(c=>{
    const div=document.createElement('div'); div.className='chip'; div.innerHTML=`<div class="t">${c.name}</div>`;
    div.onclick=()=>showFormulas(c.id); fg.appendChild(div);
  });
}
function showFormulas(id){
  const c=CHAPTERS.find(x=>x.id===id);
  const main=document.getElementById('main'); main.innerHTML='';
  const back=document.createElement('button'); back.className='back'; back.textContent='← Back to formula bank';
  back.onclick=()=>{tab='formulas'; render();}; main.appendChild(back);
  const card=document.createElement('div'); card.className='card';
  const list=(FORMULAS[id]||[]).map(f=>`<div class="formula">${f}</div>`).join('');
  card.innerHTML=`<h2>${c.name}</h2>${list||'<p class="soon">Coming soon.</p>'}`;
  main.appendChild(card);
}

function renderWeak(main){
  const card=document.createElement('div'); card.className='card';
  let rows=[];
  Object.keys(TOPICS).forEach(chId=>{
    TOPICS[chId].forEach(t=>{
      const acc=topicAccuracy(t.id);
      if(acc!==null) rows.push({name:t.name, chapter:CHAPTERS.find(c=>c.id===chId).name, acc, chId, tId:t.id});
    });
  });
  if(rows.length===0){
    card.innerHTML='<h2>Weak Areas</h2><p class="soon">Practice a few topics and self-check your answers — your weakest topics will show up here so you know exactly what to revise.</p>';
  } else {
    rows.sort((a,b)=>a.acc-b.acc);
    card.innerHTML='<h2>Weak Areas</h2><p class="soon">Lowest accuracy first — tap to jump straight into practice.</p>';
    rows.forEach(r=>{
      const cls = r.acc<50?'low':(r.acc<75?'mid':'high');
      const row=document.createElement('div'); row.className='weakrow';
      row.innerHTML=`<div><b>${r.name}</b><div class="n" style="color:var(--sub);font-size:.75rem">${r.chapter}</div></div><div class="acc ${cls}">${r.acc}%</div>`;
      row.style.cursor='pointer';
      row.onclick=()=>showTopic(r.chId, r.tId);
      card.appendChild(row);
    });
  }
  main.appendChild(card);
  const reset=document.createElement('button'); reset.className='ghost'; reset.textContent='Reset all progress';
  reset.onclick=()=>{ try{localStorage.removeItem('tsmb_topic_progress');}catch(e){} render(); };
  main.appendChild(reset);
}

render();
</script>
